version: '3.8'

services:
  # Service PostgreSQL
  postgres:
    image: postgres:15
    container_name: velib_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-velib_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Python (application)
  app:
    build: .
    container_name: velib_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-velib_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - .:/app
    networks:
      - velib_network

volumes:
  postgres_data:

networks:
  velib_network:
    driver: bridge
